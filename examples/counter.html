<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>OneScript: счётчик на кнопке</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
    button { font-size: 1rem; padding: .5rem 1rem; }
    output { font-size: 2rem; margin: 0 1rem; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h2>Счётчик на кнопке</h2>
  <p>Обработчик привязан декларативно через <code>data-os-click</code>, код исполняется
     в области видимости <code>&lt;one-script&gt;</code>.</p>

  <button id="кнопка" data-os-click="Счёт = Счёт + 1; Вывод.Текст = Строка(Счёт);">+1</button>
  <output id="вывод">0</output>

  <script src="/onescript.js"></script>

  <one-script>
    Перем Счёт;
    Счёт = 0;

    Вывод = Документ.ПолучитьЭлемент("вывод");
    сообщить("Счётчик готов");
  </one-script>
</body>
</html>
