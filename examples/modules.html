<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>#Использовать — модули и классы</title>
</head>
<body>
    <script src="onescript.js"></script>

    <h2>Импорт модуля</h2>

    <script type="text/osjs">
        #Использовать "lib/Модуль.osjs"

        Сообщить("Сложить(2, 3) = " + Модуль.Сложить(2, 3));
        Сообщить("Поле = " + Модуль.Поле);
        Модуль.Поле = 99;
        Сообщить("Поле после записи = " + Модуль.Поле);
    </script>

    <h2>Импорт класса</h2>

    <script type="text/osjs">
        #Использовать "lib/Приветствие.osjs"

        Привет = Новый Приветствие("Никита");
        Сообщить(Привет.Текст());
    </script>
</body>
</html>
