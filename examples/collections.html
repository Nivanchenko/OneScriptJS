<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>OneScript: коллекции и отчёт из BSL</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 46rem; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    caption { text-align: left; font-weight: 600; padding-bottom: .5rem; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    th { background: #f6f8fa; }
    th.число, td.число { text-align: right; font-variant-numeric: tabular-nums; }
    tfoot th, tfoot td { font-weight: 600; border-top: 2px solid #bbb; }
    #итог { color: #0b7250; }
    code { background: #f0f0f0; padding: 0 .2rem; border-radius: 3px; }
  </style>
</head>
<body>
  <h2>Коллекции и отчёт из BSL</h2>
  <p>Данные хранятся в <code>ТаблицеЗначений</code>, сортируются и суммируются в BSL,
     а строки отчёта собираются в DOM через <code>Документ.СоздатьЭлемент</code>.
     Настройки отчёта — обычная <code>Структура</code>.</p>

  <div id="отчёт"></div>

  <script src="onescript.js"></script>

  <script type="text/osjs">
    Перем Настройки;
    Перем Данные;

    Процедура ДобавитьТовар(Знач Товар, Знач Цена, Знач Количество)
      СтрокаТовара = Данные.Добавить();
      СтрокаТовара.Товар = Товар;
      СтрокаТовара.Цена = Цена;
      СтрокаТовара.Количество = Количество;
      СтрокаТовара.Стоимость = Цена * Количество;
    КонецПроцедуры

    Функция Деньги(Знач Сумма)
      Возврат Формат(Сумма, "ЧДЦ=2; ЧРД=','; ЧГ=0") + " " + Настройки.Единица;
    КонецФункции

    Процедура ДобавитьЯчейку(Знач СтрокаТаблицы, Знач Текст, Знач Тег, Знач Класс)
      Ячейка = Документ.СоздатьЭлемент(Тег);
      Ячейка.Текст = Текст;
      Если Класс <> "" Тогда
        Ячейка.Класс = Класс;
      КонецЕсли;
      Ячейка.ДобавитьВ(СтрокаТаблицы);
    КонецПроцедуры

    // --- данные и настройки ---
    Настройки = Новый Структура("Заголовок, Единица", "Отчёт по складу", "руб.");
    Данные = Новый ТаблицаЗначений;
    Данные.Колонки.Добавить("Товар");
    Данные.Колонки.Добавить("Цена");
    Данные.Колонки.Добавить("Количество");
    Данные.Колонки.Добавить("Стоимость");

    ДобавитьТовар("Клавиатура", 2500, 3);
    ДобавитьТовар("Мышь", 1200, 5);
    ДобавитьТовар("Монитор", 18000, 2);

    // Самые дорогие позиции — первыми
    Данные.Сортировать("Стоимость Убыв");

    // --- отчёт в DOM ---
    Контейнер = Документ.ПолучитьЭлемент("отчёт");

    Таблица = Документ.СоздатьЭлемент("table");
    Подпись = Документ.СоздатьЭлемент("caption");
    Подпись.Текст = Настройки.Заголовок;
    Подпись.ДобавитьВ(Таблица);

    Шапка = Документ.СоздатьЭлемент("thead");
    СтрокаШапки = Документ.СоздатьЭлемент("tr");
    Заголовки = СтрРазделить("Товар, Цена, Количество, Стоимость", ", ");
    Для Каждого Заголовок Из Заголовки Цикл
      Ячейка = Документ.СоздатьЭлемент("th");
      Ячейка.УстановитьАтрибут("scope", "col");
      Ячейка.Текст = Заголовок;
      Ячейка.ДобавитьВ(СтрокаШапки);
    КонецЦикла;
    СтрокаШапки.ДобавитьВ(Шапка);
    Шапка.ДобавитьВ(Таблица);

    Тело = Документ.СоздатьЭлемент("tbody");
    Для Каждого СтрокаТовара Из Данные Цикл
      СтрокаОтчёта = Документ.СоздатьЭлемент("tr");
      ДобавитьЯчейку(СтрокаОтчёта, СтрокаТовара.Товар, "td", "");
      ДобавитьЯчейку(СтрокаОтчёта, Деньги(СтрокаТовара.Цена), "td", "число");
      ДобавитьЯчейку(СтрокаОтчёта, Строка(СтрокаТовара.Количество), "td", "число");
      ДобавитьЯчейку(СтрокаОтчёта, Деньги(СтрокаТовара.Стоимость), "td", "число");
      СтрокаОтчёта.ДобавитьВ(Тело);
    КонецЦикла;
    Тело.ДобавитьВ(Таблица);

    Подвал = Документ.СоздатьЭлемент("tfoot");
    СтрокаИтогов = Документ.СоздатьЭлемент("tr");
    ПодписьИтогов = Документ.СоздатьЭлемент("th");
    ПодписьИтогов.УстановитьАтрибут("scope", "row");
    ПодписьИтогов.УстановитьАтрибут("colspan", "3");
    ПодписьИтогов.Текст = "Итого, позиций: " + Строка(Данные.Количество());
    ПодписьИтогов.ДобавитьВ(СтрокаИтогов);
    ДобавитьЯчейку(СтрокаИтогов, Деньги(Данные.Итог("Стоимость")), "td", "число");
    СтрокаИтогов.ДобавитьВ(Подвал);
    Подвал.ДобавитьВ(Таблица);

    Таблица.ДобавитьВ(Контейнер);

    // Выгружаем колонку и собираем из неё строку
    Перечень = СтрСоединить(Данные.ВыгрузитьКолонку("Товар"), " · ");
    Итог = Документ.СоздатьЭлемент("p");
    Итог.Идентификатор = "итог";
    Итог.Текст = "Всего по складу: " + Деньги(Данные.Итог("Стоимость")) +
      " Позиции: " + Перечень + ".";
    Итог.ДобавитьВ(Контейнер);
  </script>
</body>
</html>
