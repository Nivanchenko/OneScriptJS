<!doctype html>
<html>
<body>
<h1>manual-check: embedded .osjs (спека 015, слой A)</h1>
<p>Внутри блоков — наши инструменты; вне блоков — ничего.</p>

<script type="text/osjs">
#Использовать "../lib/Модуль.osjs"

Функция Сумма(А, Б)
  Возврат А + Б;
КонецФункции

Процедура Проверка()
  Х = 1 +;                        // OSJS2001: ошибка разбора (маппинг в HTML)
  Результат = Сумма(2, 3);        // gd → объявление Сумма; K → hover
  Сообщить("Сумма = " + Результат); // completion: «Сооб» + <C-Space>; K → hover
  // gd внутри пути импорта выше → откроется ../lib/Модуль.osjs
КонецПроцедуры
</script>

<div>Между блоками: ни диагностик, ни подсказок быть не должно.</div>

<script type="text/osjs">
Процедура ВторойБлок()
  Сообщить("второй блок");        // здесь локальная Сумма недоступна (изоляция)
КонецПроцедуры
</script>
</body>
</html>
